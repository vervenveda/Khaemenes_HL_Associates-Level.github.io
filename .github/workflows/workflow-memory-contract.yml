name: Workflow Digest and Codex Contract
on:
  push:
    branches: [main]
    paths:
      - 'workflow/**'
      - 'programs/arts/**'
      - 'tools/validate-workflow-memory.mjs'
      - '.github/workflows/workflow-memory-contract.yml'
  pull_request:
    paths:
      - 'workflow/**'
      - 'programs/arts/**'
      - 'tools/validate-workflow-memory.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/validate-workflow-memory.mjs
